<!-- VSL — RESERVA · PAGO (Paso 2 del funnel de tráfico frío) — PARTE A
     ANTES DE MONTAR ESTA PÁGINA:
     1) Comprueba que tienes un procesador de pago conectado en
        Settings > Payments > Integrations (Stripe u otro).
     2) Crea un Producto en Payments > Products, ej. "Reserva de plaza — 500€"
        (el mismo que ya uses en el resto del funnel, si aplica).

     Cómo montar esta página en GHL, en orden:
     1) Añade un bloque Custom HTML y pega este archivo (Parte A).
     2) Justo debajo, añade un Row nuevo con el elemento Order Form de
        GHL, enlazado al producto "Reserva de plaza — 500€".
        Dale a ese Row: ancho de contenido 560px centrado, sin
        fondo/borde propio (ver estilo del Order Form más abajo).
     3) Debajo de ese Row, añade otro bloque Custom HTML y pega
        ghl-reserva-pago-parteB.html (Parte B).
     4) El CSS va aparte: pega ghl-reserva-pago.css en el campo Custom
        CSS de esta página de GHL (una sola vez).

     ESTILO DEL ORDER FORM (pestaña Style del propio elemento, para que
     no desentone con el resto del funnel):
       - Fondo del formulario: #17140f
       - Borde: 1px solid #2a2419, radio 18px
       - Texto / labels: #f3efe7 (texto) · #b8b0a2 (labels)
       - Fondo de los inputs: #100e0c · borde #2a2419 · radio 12px
       - Botón de pago: fondo #c9962f (o el degradado si lo permite:
         linear-gradient(120deg, #a9781f, #f2cf6b, #c9962f)), texto
         #1a1305, radio 999px
       - Fuente: Poppins -->

<!-- LOGO (flotante, sin barra superior) -->
<a href="#top" class="logo logo-float">

</a>

<div class="container funnel-lead" id="top">
  <div class="progress">
    <div class="progress-step done"><span class="progress-dot"></span>Reserva</div>
    <span class="progress-line"></span>
    <div class="progress-step active"><span class="progress-dot"></span>Pago</div>
  </div>

  <div class="funnel-head">
    <h1>Confirma tu <em>reserva</em></h1>
    <p>Un último paso: completa el pago del depósito para bloquear tu plaza. El resto se abona por transferencia hasta 3 semanas antes del inicio del curso.</p>
  </div>

  <div class="summary-card">
    <div>
      <span class="label">Concepto</span>
      <span class="val">Reserva de plaza — Armonización Facial Integral</span>
    </div>
    <span class="amount">500€</span>
  </div>
</div>
