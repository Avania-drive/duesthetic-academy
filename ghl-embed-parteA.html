<!-- LANDING — PARTE A de 4 (+ 3 snippets de cursos aparte)
     Ya no usamos iframe/modal propio para el formulario: se abre con
     Popups nativos de GHL, disparados por Buttons nativos de GHL.
     Esta página tiene 5 botones "Más información" en total. Móntala
     así, en este orden exacto:

     1) Crea un Popup en GHL (Sites → Popups → Nuevo) con el elemento
        Form dentro (el mismo "[FORM] Reserva"). Trigger: manual /
        On Click (NO "Always Show"). Puedes usar el MISMO Popup para
        los 5 botones, no hace falta crear uno por botón.
     2) Pega este archivo (Parte A) en un bloque Custom HTML.
     3) Debajo, añade un Row con un Button nativo:
          - Texto: "Más información"
          - Action: "Open Popup" → el Popup que creaste en el paso 1
          - Clase CSS del botón: "botonpopup" — hereda el estilo dorado
            ya definido en ghl-embed.css (fondo degradado, texto
            #1a1305, radio 999px, padding 14px 30px, Poppins 600),
            sin tener que replicar valores a mano.
          - Estilo del Row: fondo #0a0908 (el mismo que el hero),
            contenido centrado, sin borde propio, padding vertical
            ~20px 0.
     4) Debajo de ese Row, añade otro bloque Custom HTML y pega
        ghl-embed-parteB.html (Parte B).
     5) El CSS va aparte: pega ghl-embed.css en el campo Custom CSS
        de esta página de GHL (una sola vez).
     Imágenes y vídeos se sirven directamente desde
     https://duesthetic-academy.vercel.app/assets/... (el despliegue
     actual), no hace falta subirlas a la Media Library de GHL. -->
