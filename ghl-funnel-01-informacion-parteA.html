<!-- PASO 1 DE 4 · INFORMACIÓN / AGENDA TU LLAMADA — PARTE A
     Cómo montar esta página en GHL, en orden:
     1) Añade un bloque Custom HTML y pega este archivo (Parte A).
     2) Justo debajo, añade un Row nuevo con el elemento Calendar de GHL
        (Inline Embed) del calendario "llamada con formadores" — el mismo
        que ya usas en el popup de la landing.
        Dale a ese Row estas propiedades para que combine con el resto:
          - Ancho de contenido: 760px, centrado
          - Fondo: #17140f
          - Borde: 1px solid #2a2419
          - Radio de borde: 18px
          - Padding interno: 10px
     3) Debajo de ese Row, añade otro bloque Custom HTML y pega
        ghl-funnel-01-informacion-parteB.html (Parte B).
     4) El CSS va aparte: pega ghl-funnel-01-informacion.css en el campo
        Custom CSS de esta página de GHL (una sola vez). -->
