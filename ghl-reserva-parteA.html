<!-- VSL — RESERVA (tráfico frío Meta) — PARTE A
     Cómo montar esta página en GHL, en orden:
     1) Añade un bloque Custom HTML y pega este archivo (Parte A).
     2) Justo debajo, añade un Row nuevo con un elemento Button nativo
        de GHL (no Custom HTML) — este es el CTA del hero:
          - Texto: "Reservar mi plaza — 500€"
          - Action: "Go to Next Step" (el paso "Pago" del funnel) —
            así queda trackeado nativamente en las métricas del funnel.
          - Estilo del botón: fondo degradado (o sólido #c9962f si no
            permite degradado), texto #1a1305, radio 999px, padding
            16px 38px, fuente Poppins 600.
          - Estilo del Row: sin fondo/borde propio, fondo #0a0908 (el
            mismo que el hero), contenido centrado, padding 20px 0.
     3) Debajo de ese Row, añade otro bloque Custom HTML y pega
        ghl-reserva-parteB.html (Parte B).
     4) El CSS va aparte: pega ghl-reserva.css en el campo Custom CSS
        de esta página de GHL (una sola vez).
     Imágenes se sirven directamente desde
     https://duesthetic-academy.vercel.app/assets/... (el despliegue
     actual), no hace falta subirlas a la Media Library de GHL. -->
