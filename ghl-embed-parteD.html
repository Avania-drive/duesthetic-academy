<!-- ============================================================
     SCRIPTS — carrusel + botón proxy
     El formulario en sí lo abre GHL solo (Popup nativo). Este script
     solo hace de puente: al pulsar uno de nuestros botones visibles
     (.js-popup-trigger), busca su botón nativo oculto correspondiente
     (por el id en data-proxy) y le dispara un .click() real, que es
     lo que realmente abre el Popup.
     ============================================================ -->
<script>
document.addEventListener('click', (e) => {
  const trigger = e.target.closest('.js-popup-trigger');
  if (trigger) {
    const proxy = document.getElementById(trigger.dataset.proxy);
    if (proxy) proxy.click();
    return;
  }
  const arrow = e.target.closest('.carousel-arrow');
  if (arrow) {
    const carousel = document.getElementById(arrow.dataset.target);
    const track = carousel && carousel.querySelector('.carousel-track');
    if (!track) return;
    const card = track.querySelector('.phone-card');
    const gap = 20;
    const scrollAmount = (card ? card.offsetWidth : 230) + gap;
    track.scrollBy({
      left: arrow.classList.contains('next') ? scrollAmount : -scrollAmount,
      behavior: 'smooth'
    });
  }
}, true);
</script>
