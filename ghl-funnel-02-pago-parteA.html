<!-- PASO 3 DE 4 · PAGO — PARTE A
     ANTES DE MONTAR ESTA PÁGINA:
     1) Comprueba que tienes un procesador de pago conectado en
        Settings > Payments > Integrations (Stripe u otro). Si no lo tienes,
        conéctalo ahí primero — sin esto el Order Form no puede cobrar.
     2) Crea un Producto en Payments > Products, ej. "Reserva de plaza — 500€".
        La web usa 500€ como depósito universal (así lo dice el copy en varias
        secciones), así que un único producto cubre Curso Grupal, VIP y
        Monográfico para empezar. Si más adelante quieres depósitos distintos
        por curso, se crean productos adicionales y se duplica este paso.

     Cómo montar esta página en GHL, en orden:
     1) Añade un bloque Custom HTML y pega este archivo (Parte A).
     2) Justo debajo, añade un Row nuevo con el elemento Order Form de GHL,
        enlazado al producto "Reserva de plaza — 500€".
        Dale a ese Row: ancho de contenido 640px centrado, fondo #17140f,
        borde 1px solid #2a2419, radio 18px, padding 34px (para que combine
        con el resto de tarjetas de la página).
     3) Debajo de ese Row, añade otro bloque Custom HTML y pega
        ghl-funnel-02-pago-parteB.html (Parte B).
     4) El CSS va aparte: pega ghl-funnel-02-pago.css en el campo Custom CSS
        de esta página de GHL (una sola vez). -->

<header class="funnel-header">
  <img src="https://duesthetic-academy.vercel.app/assets/img/logo.png" alt="Duesthetic Academy">
</header>

<div class="progress">
  <div class="progress-step done"><span class="progress-dot"></span>Info</div>
  <span class="progress-line"></span>
  <div class="progress-step done"><span class="progress-dot"></span>Reservar</div>
  <span class="progress-line"></span>
  <div class="progress-step active"><span class="progress-dot"></span>Pago</div>
  <span class="progress-line"></span>
  <div class="progress-step"><span class="progress-dot"></span>Agenda</div>
</div>

<div class="container funnel-lead">
  <div class="funnel-head">
    <h1>Un último paso</h1>
    <p>Confirma tu reserva completando el pago del depósito. El resto se abona por transferencia hasta 3 semanas antes del inicio del curso.</p>
  </div>

  <div class="summary-card">
    <div>
      <span class="label">Concepto</span>
      <span class="val">Reserva de plaza</span>
    </div>
    <span class="amount">500€</span>
  </div>
</div>
